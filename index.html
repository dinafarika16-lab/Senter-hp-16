<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senter Open-Source Sederhana</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        h2 {
            margin-bottom: 30px;
        }
        #btnSenter {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            background-color: #444;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .nyala {
            background-color: #ffeb3b !important;
            color: black !important;
            box-shadow: 0 0 30px #ffeb3b !important;
        }
    </style>
</head>
<body>

    <h2>Aplikasi Senter HP</h2>
    <button id="btnSenter" onclick="nyalakanSenter()">MATI</button>

    <script>
        let statusNyala = false;
        let trackKamera = null;

        async function nyalakanSenter() {
            const tombol = document.getElementById("btnSenter");

            try {
                if (!statusNyala) {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }
                    });
                    
                    trackKamera = stream.getVideoTracks()[0];
                    const capabilities = trackKamera.getCapabilities();
                    
                    if (capabilities.torch) {
                        await trackKamera.applyConstraints({
                            advanced: [{ torch: true }]
                        });
                        statusNyala = true;
                        tombol.innerText = "NYALA";
                        tombol.classList.add("nyala");
                    } else {
                        alert("Maaf, hardware HP Anda tidak mendirikan fitur senter via browser.");
                    }
                } else {
                    if (trackKamera) {
                        await trackKamera.applyConstraints({
                            advanced: [{ torch: false }]
                        });
                        trackKamera.stop();
                    }
                    statusNyala = false;
                    tombol.innerText = "MATI";
                    tombol.classList.remove("nyala");
                }
            } catch (error) {
                alert("Gagal mengakses kamera/senter: " + error);
            }
        }
    </script>

</body>
</html>
